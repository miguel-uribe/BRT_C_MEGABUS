name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the Python environment
        run: uv sync
      - name: Build the engine
        run: |
          uv run cmake -S . -B build
          uv run cmake --build build
      - name: Run the tests
        run: uv run pytest
